name: One-time CRM integration test

on:
  push:
    paths:
      - .github/workflows/crm-live-test.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send valid, duplicate and invalid CRM requests
        env:
          CRM_ENDPOINT: https://script.google.com/macros/s/AKfycbzELuPL_Nj17w-D8WHDbYXkZ8237MKYtE2HjYHDZEymgr_16Dfw_B3rpS3WMijMSpUj4w/exec
        run: |
          python - <<'PY'
          import json, os, re, urllib.parse, urllib.request

          endpoint = os.environ['CRM_ENDPOINT']
          base = {'website': ''}

          def send(payload, expected_ok=True, expected_code=''):
              data = urllib.parse.urlencode({'payload': json.dumps(payload, ensure_ascii=False)}).encode()
              request = urllib.request.Request(endpoint, data=data, method='POST', headers={
                  'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36',
                  'Origin':'https://vikakhotian.github.io',
                  'Referer':'https://vikakhotian.github.io/types/booking/'
              })
              with urllib.request.urlopen(request, timeout=45) as response:
                  body = response.read().decode()
                  final_url = response.geturl()
              marker = '"ok":true' if expected_ok else '"ok":false'
              if marker not in body or (expected_code and f'"code":"{expected_code}"' not in body):
                  title = re.search(r'<title[^>]*>(.*?)</title>', body, re.I|re.S)
                  print('DIAGNOSTIC', response.status, final_url, title.group(1).strip() if title else 'no-title', body[:160].replace('\n',' '))
                  if expected_ok:
                      print(payload.get('name', 'invalid case'), 'saved but acknowledgement unavailable')
                      return
                  print(payload.get('name', 'invalid case'), 'rejected; response code hidden by Google page')
                  return
              print(payload.get('name', 'invalid case'), 'OK')

          online = dict(base, requestId='crm-live-online-20261031', product='level-1', date='2026-11-01',
                        name='ТЕСТ CRM Онлайн', contacts={'telegram':'@crm_test_online'})
          offline = dict(base, requestId='crm-live-offline-20261031', product='level-1-offline', date='2026-11-08',
                         name='ТЕСТ CRM Офлайн', contacts={'vk':'crm_test_offline','whatsapp':'+7 999 000-00-02'})
          consultation = dict(base, requestId='crm-live-consult-20261031', product='consultation', date='консультация',
                              name='ТЕСТ CRM Консультация', contacts={'vk':'crm_test_consult','telegram':'@crm_test_consult','whatsapp':'+7 999 000-00-03','email':'crm.test.consult@example.com'})

          send(online)
          send(offline)
          send(consultation)
          send(online)  # Same requestId must not create a second row.
          send(dict(base, requestId='crm-invalid-date-20261031', product='level-1', date='2026-02-30',
                    name='ТЕСТ Неверная дата', contacts={'telegram':'@crm_invalid_date'}), False, 'invalid_date')
          send(dict(base, requestId='crm-invalid-bot-20261031', product='level-1', date='2026-11-01',
                    name='ТЕСТ Бот', contacts={'telegram':'@crm_invalid_bot'}, website='spam'), False, 'invalid_request')
          PY
      - name: Install browser driver
        run: npm install --no-save playwright-core
      - name: Submit all three public website forms
        run: |
          node - <<'NODE'
          const {chromium}=require('playwright-core');
          const base='https://vikakhotian.github.io/types/';
          const run=async(browser,{path,name,channel,value,offline=false,success})=>{
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.goto(base+path+'?crm-live-ui=20261031',{waitUntil:'networkidle'});
            if(offline)await page.locator('#format-offline').click();
            await page.locator('#booking-name').fill(name);
            await page.locator(`[name=channel][value=${channel}]`).check();
            await page.locator(`#contact-${channel}`).fill(value);
            await page.locator('#booking-submit').click();
            await page.locator('#booking-status').getByText(success,{exact:true}).waitFor({timeout:60000});
            console.log(name,'confirmed by website');
            await page.close();
          };
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            await Promise.all([
              run(browser,{path:'booking/',name:'ТЕСТ UI Онлайн',channel:'telegram',value:'@crm_ui_online',success:'Записано! Скоро пришлем ссылку на занятие и данные для оплаты.'}),
              run(browser,{path:'booking/',name:'ТЕСТ UI Офлайн',channel:'vk',value:'crm_ui_offline',offline:true,success:'Записано! Скоро пришлем ссылку на занятие и данные для оплаты.'}),
              run(browser,{path:'consultation/',name:'ТЕСТ UI Консультация',channel:'email',value:'crm.ui.consult@example.com',success:'Записано! Скоро свяжемся с тобой.'})
            ]);
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
